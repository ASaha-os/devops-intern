name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on sysinfo.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          shell: bash
          files: scripts/sysinfo.sh

      - name: Run ShellCheck on healthcheck.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          shell: bash
          files: scripts/healthcheck.sh

      - name: Run Hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          tags: nginx-app:test
          build-args: |
            BUILD_SHA=${{ github.sha }}

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ghcr.io/asaha-os/devops-intern:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load test image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          tags: nginx-app:test
          load: true
          build-args: |
            BUILD_SHA=${{ github.sha }}

      - name: Run container
        run: |
          docker run -d --name nginx-test -p 8080:8080 nginx-app:test
          sleep 3

      - name: Test root endpoint
        run: curl -f http://localhost:8080/

      - name: Test health endpoint
        run: curl -f http://localhost:8080/healthz

      - name: Cleanup
        if: always()
        run: |
          docker stop nginx-test || true
          docker rm nginx-test || true
